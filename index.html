*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

  font-family:'Inter',sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:32px 16px 56px;
  position:relative;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:absolute;
  top:-120px;
  left:50%;
  transform:translateX(-50%);
  width:640px;
  height:640px;
  border:2px solid rgba(234,244,251,0.05);
  border-radius:50%;
  pointer-events:none;
}
body::after{
  content:"";
  position:absolute;
  top:-120px;
  left:50%;
  transform:translateX(-50%);
  width:2px;
  height:640px;
  background:rgba(234,244,251,0.04);
  pointer-events:none;
}
#app{
  width:100%;
  max-width:520px;
  position:relative;
  z-index:1;
}
.eyebrow{
  font-family:'Oswald',sans-serif;
  font-size:13px;
  letter-spacing:0.14em;
  color:var(--gold);
  font-weight:500;
  margin-bottom:6px;
}
h1.title{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:40px;
  line-height:1.02;
  margin:0 0 8px;
  color:var(--ice);
}
p.sub{
  color:var(--ice-dim);
  font-size:15.5px;
  line-height:1.5;
  margin:0 0 28px;
  max-width:44ch;
}
.card{
  background:linear-gradient(180deg, var(--panel), #0c2036);
  border:1px solid var(--panel-line);
  border-radius:14px;
  padding:28px 26px;
  box-shadow:0 24px 60px -20px rgba(0,0,0,0.6);
}
.btn{
  font-family:'Oswald',sans-serif;
  font-weight:600;
  font-size:16px;
  letter-spacing:0.01em;
  border-radius:9px;
  border:none;
  padding:14px 18px;
  cursor:pointer;
  transition:transform .12s ease, background .15s ease, box-shadow .15s ease;
  width:100%;
}
.btn:active{transform:scale(0.98);}
.btn-yes{background:var(--green);color:#052a1c;}
.btn-yes:hover{background:#57dba0;}
.btn-no{background:var(--red);color:#2a0708;}
.btn-no:hover{background:#ef6a6e;}
.btn-dk{background:transparent;color:var(--ice-dim);border:1px solid var(--panel-line);}
.btn-dk:hover{border-color:var(--ice-dim);color:var(--ice);}
.btn-primary{background:var(--gold);color:#2a1c02;}
.btn-primary:hover{background:#f7c455;}
.btn-ghost{background:transparent;color:var(--ice-dim);border:1px dashed var(--panel-line);font-weight:500;font-size:14px;}
.btn-ghost:hover{color:var(--ice);border-color:var(--ice-dim);}
.row{display:flex;gap:10px;}
.row > .btn{flex:1;}
.stack{display:flex;flex-direction:column;gap:10px;}
.question-text{
  font-family:'Oswald',sans-serif;
  font-size:25px;
  font-weight:600;
  line-height:1.28;
  color:var(--ice);
  margin:2px 0 26px;
}
.meta-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12.5px;
  color:var(--ice-dim);
  margin-bottom:16px;
  font-family:'Oswald',sans-serif;
  letter-spacing:0.04em;
}
.progress-track{
  height:6px;
  border-radius:4px;
  background:rgba(234,244,251,0.08);
  overflow:hidden;
  margin-bottom:22px;
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg, var(--gold-dim), var(--gold));
  border-radius:4px;
  transition:width .4s ease;
}
.jersey-number{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:64px;
  color:var(--gold);
  line-height:1;
}
.reveal-name{
  font-family:'Oswald',sans-serif;

  font-size:34px;

  margin:4px 0 2px;
}
.reveal-team{
  color:var(--ice-dim);
  font-size:14.5px;
  margin-bottom:20px;
}
.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin:18px 0 22px;
}
.stat-box{
  background:rgba(234,244,251,0.04);
  border:1px solid var(--panel-line);
  border-radius:8px;
  padding:10px 8px;
  text-align:center;
}
.stat-num{
  font-family:'Oswald',sans-serif;
  font-weight:700;
  font-size:22px;
  color:var(--gold);
}
.stat-label{
  font-size:10.5px;
  color:var(--ice-dim);
  text-transform:uppercase;
  letter-spacing:0.06em;
  margin-top:2px;
}
input[type="text"], input[type="number"]{
  width:100%;
  background:rgba(234,244,251,0.05);
  border:1px solid var(--panel-line);
  border-radius:8px;
  padding:13px 14px;
  color:var(--ice);
  font-size:16px;
  font-family:'Inter',sans-serif;
  margin-bottom:12px;
}
input::placeholder{color:#5f7b93;}
input:focus{outline:none;border-color:var(--gold-dim);}
.footer-link{
  text-align:center;
  margin-top:22px;
  font-size:12.5px;
  color:#3f5b74;
}
.footer-link button{
  background:none;border:none;color:#5a7891;text-decoration:underline;cursor:pointer;font-size:12.5px;font-family:'Inter',sans-serif;
}
.footer-link button:hover{color:var(--ice-dim);}
.pill-list{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:6px 0 20px;
}
.pill-btn{
  font-family:'Inter',sans-serif;
  font-size:14px;
  font-weight:500;
  background:rgba(234,244,251,0.04);

  color:var(--ice);
  border-radius:20px;
  padding:8px 14px;
  cursor:pointer;
}
.pill-btn:hover{border-color:var(--gold-dim);}
table.admin-table{
  width:100%;
  border-collapse:collapse;
  font-size:13.5px;
  margin:14px 0;
}
table.admin-table th{
  text-align:left;
  color:var(--ice-dim);
  font-weight:600;
  font-size:11.5px;
  text-transform:uppercase;
  letter-spacing:0.05em;
  padding:6px 8px;
  border-bottom:1px solid var(--panel-line);
}
table.admin-table td{
  padding:8px 8px;
  border-bottom:1px solid rgba(28,58,88,0.5);
}
.fade-in{animation:fadeIn .28s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.thinking{
  display:flex;
  align-items:center;
  gap:10px;
  color:var(--ice-dim);

  margin-bottom:18px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 1.1s infinite ease-in-out;}
.dot:nth-child(2){animation-delay:.15s;}
.dot:nth-child(3){animation-delay:.3s;}
@keyframes pulse{0%,80%,100%{opacity:.25;}40%{opacity:1;}}
.small-note{font-size:12.5px;color:var(--ice-dim);margin-top:14px;line-height:1.5;}
.confirm-name{color:var(--gold);}
</style>

const CATEGORICAL_ATTRS = [
  {key:'team', phrase:(v)=>`Does this player play for the ${v}?`},
  {key:'position', phrase:(v)=> v==='UTIL' ? 'Does this player play more than one position (listed as UTIL)?' : `Is this player's main position ${v}?`}
];

function median(nums){
  const s = [...nums].sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 ? s[mid] : (s[mid-1]+s[mid])/2;
}
const medianGoals = median(PLAYERS.map(p=>p.goals));
const medianAssists = median(PLAYERS.map(p=>p.assists));

// Derived, "interpreted" traits built by combining the raw stat columns —
// these read like scouting notes instead of literal stat-threshold filters.
PLAYERS.forEach(p=>{
  p.traitSniper = p.goals > p.assists;
  p.traitClutch = p.potg > 0;
  p.traitCupChamp = p.slavaCups > 0;
  p.traitDecorated = p.nominated && p.wonAward;
  p.traitFrontOffice = p.secretary || p.exec || p.everFO;
});

const TRAIT_ATTRS = [
  {key:'traitSniper', text:'Does this player score more goals than they rack up assists — more of a sniper than a playmaker?'},
  {key:'traitClutch', text:'Has this player ever earned a Player of the Game award in Season 7?'},
  {key:'traitCupChamp', text:'Has this player ever won a Slava Cup?'},
  {key:'traitDecorated', text:'Was this player both nominated for AND did they actually win an award in Season 7?'},
  {key:'traitFrontOffice', text:'Has this player ever held a front-office role — exec, secretary, or FO?'},
];

let candidates = [];
let askedBool = new Set();
let askedCat = new Set();
let questionCount = 0;
let currentQuestion = null;
let guessModeQueue = null; // array of remaining candidates when in "guess now" mode
let history = []; // for the "well actually" back button

function resetState(){
  candidates = PLAYERS.slice();
  askedBool = new Set();
  askedCat = new Set();
  questionCount = 0;
  currentQuestion = null;
  guessModeQueue = null;
  history = [];
}

function pickQuestion(pool){
  const candidatesPool = [];
  for (const a of [...BOOL_ATTRS, ...TRAIT_ATTRS]){
    if (askedBool.has(a.key)) continue;
    const yes = pool.filter(p=>p[a.key]).length;
    const no = pool.length - yes;
    if (yes===0 || no===0){ continue; }
    candidatesPool.push({type:'bool', attr:a.key, text:a.text, yes, no, score:Math.min(yes,no)});
  }
  for (const a of CATEGORICAL_ATTRS){
    const values = [...new Set(pool.map(p=>p[a.key]))];
    for (const v of values){
      const k = a.key+'|'+v;
      if (askedCat.has(k)) continue;
      const yes = pool.filter(p=>p[a.key]===v).length;
      const no = pool.length - yes;
      if (yes===pool.length || yes===0) continue;
      candidatesPool.push({type:'cat', attr:a.key, value:v, text:a.phrase(v), yes, no, score:Math.min(yes,no)});
    }
  }
  if (candidatesPool.length===0) return null;
  // Prefer questions that split the current pool as evenly as possible.
  // This keeps asking useful questions instead of jumping to a guess.
  candidatesPool.sort((x,y)=>{
    if (y.score !== x.score) return y.score - x.score;
    // Prefer the question with the larger absolute reduction on a Yes/No answer.
    const xWorst = Math.max(x.yes, x.no);
    const yWorst = Math.max(y.yes, y.no);
    return xWorst - yWorst;
  });
  return candidatesPool[0];
}

function snapshotState(){
  return {
    candidates: candidates.slice(),
    askedBool: new Set(askedBool),
    askedCat: new Set(askedCat),
    questionCount
  };
}
function restoreState(s){
  candidates = s.candidates;
  askedBool = s.askedBool;
  askedCat = s.askedCat;
  questionCount = s.questionCount;
}

function applyAnswer(answer){ // 'yes' | 'no' | 'dk'
  const q = currentQuestion;
  history.push(snapshotState());
  if (q.type==='bool'){
    if (answer==='yes') candidates = candidates.filter(p=>p[q.attr]);
    else if (answer==='no') candidates = candidates.filter(p=>!p[q.attr]);
    askedBool.add(q.attr);
  } else if (q.type==='cat'){
    if (answer==='yes') candidates = candidates.filter(p=>p[q.attr]===q.value);
    else if (answer==='no') candidates = candidates.filter(p=>p[q.attr]!==q.value);
    askedCat.add(q.attr+'|'+q.value);
  }
  questionCount++;
  proceed();
}

function proceed(){
  // Never guess merely because the pool is small.
  // Keep asking while at least one question can distinguish the candidates.
  if (candidates.length===0){ render('stumped'); return; }
  if (candidates.length===1){ render('reveal-confirm', {player: candidates[0]}); return; }

  const q = pickQuestion(candidates);
  if (!q){
    // All remaining players have identical answers for every available
    // question, so no further automatic deduction is possible.
    render('manual-pick');
    return;
  }

  currentQuestion = q;
  render('question');
}

}

  const pct = Math.max(6, 100 - (remaining / PLAYERS.length) * 100);
  return Math.min(100, pct);
}

        <div class="card">
          <div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div>&nbsp;I think I've got it. One more check —</div>
          <div class="question-text">${esc(player.confirmQ)}</div>
          <div class="row">
            <button class="btn btn-yes" id="cf-yes">Yes</button>
            <button class="btn btn-no" id="cf-no">No</button>
          </div>
        </div>
        <div class="footer-link"><button id="restart-btn">Restart</button></div>
      </div>
    `;
    document.getElementById('cf-yes').onclick = () => render('guess', {player});
    document.getElementById('cf-no').onclick = () => render('stumped');
    document.getElementById('restart-btn').onclick = () => render('start');
  } else {
    render('guess', {player});
  }
}

function renderGuess(player){
  app.innerHTML = `
    <div class="fade-in">
      <div class="eyebrow">NRHA · SEASON 7</div>
      <h1 class="title" style="font-size:28px;">Slavanator</h1>
      <div class="card">
        <div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div>&nbsp;My guess is...</div>
        <div class="reveal-name">${esc(player.name)}</div>
        <div class="reveal-team">${esc(player.team)} · ${esc(player.position)}</div>
        <div class="row" style="margin-top:8px;">
          <button class="btn btn-yes" id="g-yes">Yes, that's it!</button>
          <button class="btn btn-no" id="g-no">Nope</button>
        </div>
      </div>
      <div class="footer-link"><button id="restart-btn">Restart</button></div>
    </div>
  `;
  document.getElementById('g-yes').onclick = async () => {
    const yesBtn = document.getElementById('g-yes');
    yesBtn.disabled = true;
    yesBtn.textContent = 'Checking roster...';

    // If the jersey number is not in the built-in roster, check Supabase
    // for a previously submitted number for this player.
    if (player.jersey === -1) {
      try {
        const savedNumber = await getJerseyNumber(player.name);
        if (savedNumber !== null) {
          player.jersey = savedNumber;
          render('win', {player});
          return;
        }
      } catch (e) {
        console.warn('Could not check saved jersey number:', e);
      }
      render('number-form', {player});
    } else {
      render('win', {player});
    }
  };
  document.getElementById('g-no').onclick = () => {
    if (guessModeQueue !== null){
      guessNext();
    } else {
      render('stumped');
    }
  };
  document.getElementById('restart-btn').onclick = () => render('start');
}

function renderWin(player){
  app.innerHTML = `
    <div class="fade-in">
      <div class="eyebrow">GOT IT IN ${questionCount} QUESTION${questionCount===1?'':'S'}</div>
      <h1 class="title" style="font-size:30px;">Nailed it.</h1>
      <div class="card">
        <div class="reveal-name">${esc(player.name)}</div>
        <div class="reveal-team">${esc(player.team)} · ${esc(player.position)}${player.jersey!==-1 ? ' · #'+player.jersey : ''}</div>
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-num">${player.goals}</div><div class="stat-label">Goals</div></div>
          <div class="stat-box"><div class="stat-num">${player.assists}</div><div class="stat-label">Assists</div></div>
          <div class="stat-box"><div class="stat-num">${player.slavaCups}</div><div class="stat-label">Slava Cups</div></div>
        </div>
        <button class="btn btn-primary" id="play-again">Play Again</button>
      </div>
    </div>
  `;
  document.getElementById('play-again').onclick = () => render('start');
}

function renderNumberForm(player){
  app.innerHTML = `
    <div class="fade-in">
      <div class="eyebrow">GOT IT IN ${questionCount} QUESTION${questionCount===1?'':'S'}</div>
      <h1 class="title" style="font-size:30px;">Nailed it.</h1>
      <div class="card">
        <div class="reveal-name">${esc(player.name)}</div>
        <div class="reveal-team">${esc(player.team)} · ${esc(player.position)}</div>
        <p style="color:var(--ice-dim);font-size:14.5px;line-height:1.5;margin:18px 0 10px;">
          Are you <span class="confirm-name">${esc(player.name)}</span>? Tell me your jersey number here — it's not on file yet, and it'll help fill out the roster.
        </p>
        <input type="number" id="jersey-input" placeholder="Jersey number" inputmode="numeric">
        <div class="row">
          <button class="btn btn-primary" id="submit-jersey">Submit Number</button>
        </div>
        <button class="btn btn-ghost" id="skip-jersey" style="margin-top:10px;">Skip / not me after all</button>
      </div>
    </div>
  `;
  document.getElementById('submit-jersey').onclick = async () => {
    const val = document.getElementById('jersey-input').value.trim();
    const btn = document.getElementById('submit-jersey');
    if (!val || isNaN(parseInt(val,10))){
      document.getElementById('jersey-input').style.borderColor = 'var(--red)';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Saving...';
    const number = parseInt(val,10);
    try {
      await submitJerseyNumber(player.name, number);
      // Make the number available immediately for the current game.
      player.jersey = number;
      render('win', {player});
    } catch(e){
      btn.disabled = false;
      btn.textContent = 'Submit Number';
      alert('Could not save your number. Please try again.');
    }
  };
  document.getElementById('skip-jersey').onclick = () => render('stumped');
}

async function getJerseyNumber(name){
  const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_jersey_number`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
    },
    body: JSON.stringify({p_player_name: name})
  });

  if (!response.ok) {
    const errorText = await response.text();
    throw new Error(`Lookup failed (${response.status}): ${errorText}`);
  }

  const data = await response.json();
  if (!Array.isArray(data) || data.length === 0) return null;
  return Number(data[0].jersey_number);
}

async function submitJerseyNumber(name, number){
  const response = await fetch(`${SUPABASE_URL}/rest/v1/jersey_submissions`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify({
      player_name: name,
      jersey_number: number
    })
  });

  if (!response.ok) {
    const errorText = await response.text();
    throw new Error(`Submission failed (${response.status}): ${errorText}`);
  }
}


function renderStumped(){
  app.innerHTML = `
    <div class="fade-in">
      <div class="eyebrow">NRHA · SEASON 7</div>
      <h1 class="title" style="font-size:28px;">You win this one.</h1>
      <div class="card">
        <p style="color:var(--ice-dim);font-size:14.5px;line-height:1.6;margin:0 0 16px;">
          I couldn't figure out who you were thinking of. Who was it?
        </p>
        <input type="text" id="who-input" list="roster-list" placeholder="Type a player name...">
        <datalist id="roster-list">
          ${PLAYERS.map(p=>`<option value="${esc(p.name)}">`).join('')}
        </datalist>
        <button class="btn btn-primary" id="reveal-who">Show Me</button>
        <button class="btn btn-ghost" id="play-again-2" style="margin-top:10px;">Play Again</button>
      </div>
    </div>
  `;
  document.getElementById('reveal-who').onclick = () => {
    const val = document.getElementById('who-input').value.trim().toLowerCase();
    const found = PLAYERS.find(p=>p.name.toLowerCase()===val);
    if (found){
      alert(`${found.name} — ${found.team}, ${found.position}. Thanks for the tip!`);
    }
    render('start');
  };
  document.getElementById('play-again-2').onclick = () => render('start');
}

function renderManualPick(){
  app.innerHTML = `
    <div class="fade-in">
      <div class="eyebrow">NRHA · SEASON 7</div>
      <h1 class="title" style="font-size:28px;">Down to a few.</h1>
      <div class="card">
        <p style="color:var(--ice-dim);font-size:14.5px;line-height:1.6;margin:0 0 4px;">
          These players match everything so far. Is it one of them?
        </p>
        <div class="pill-list">
          ${candidates.map((p,i)=>`<button class="pill-btn" data-idx="${i}">${esc(p.name)}</button>`).join('')}
        </div>
        <button class="btn btn-ghost" id="none-of-these">None of these</button>
      </div>
      <div class="footer-link"><button id="restart-btn">Restart</button></div>
    </div>
  `;
  candidates.forEach((p,i)=>{
    const el = app.querySelector(`[data-idx="${i}"]`);
    el.onclick = () => render('reveal-confirm', {player: p});
  });
  document.getElementById('none-of-these').onclick = () => render('stumped');
  document.getElementById('restart-btn').onclick = () => render('start');
}


render('start');
</script>
</body>
</html>
